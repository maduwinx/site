<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acervo de Microfilmes · Gazeta Mendes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%23f2efe6' font-family='serif'%3EG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
:root{--papel:#f2efe6;--tinta:#1a1a1a;--cinza:#6b6759;--vermelho:#8c2a1f}
html,body{background:var(--papel);color:var(--tinta);margin:0;font-family:"Source Serif 4",Georgia,serif}
body.terminal{min-height:100vh}
.cabecalho-terminal{text-align:center;border-bottom:4px double var(--tinta);padding:1.2rem 1rem .8rem;max-width:900px;margin:0 auto}
.cabecalho-terminal .sigla{font-family:Archivo,sans-serif;font-weight:900;font-size:2rem;letter-spacing:.08em;margin:0}
.cabecalho-terminal .subtitulo{font-family:Archivo,sans-serif;font-size:.8rem;letter-spacing:.2em;color:var(--cinza);margin:.3rem 0 0}
.btn-voltar{display:inline-block;margin:.8rem 0 0;padding:.5rem 1rem;border:2px solid var(--tinta);font-family:Archivo,sans-serif;font-weight:700;color:var(--tinta);text-decoration:none;background:transparent}
.btn-voltar:hover,.btn-voltar:focus{background:var(--tinta);color:var(--papel)}
main.acervo{max-width:900px;margin:1.5rem auto;padding:0 1rem}
.caixa-busca{border:3px double var(--tinta);padding:1.2rem;background:#faf8f2}
.caixa-busca label{display:block;font-family:Archivo,sans-serif;font-weight:700;font-size:.85rem;letter-spacing:.12em;margin-bottom:.5rem}
.linha-entrada{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.linha-entrada span{font-family:Archivo,sans-serif;font-weight:900;font-size:1.2rem}
#linha{flex:1;min-width:200px;padding:.6rem .8rem;border:1px solid var(--tinta);background:#fff;font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem;color:var(--tinta)}
#linha:focus{outline:2px solid var(--vermelho);outline-offset:1px}
.btn-consulta{padding:.6rem 1.1rem;border:2px solid var(--tinta);background:var(--tinta);color:var(--papel);font-family:Archivo,sans-serif;font-weight:700;letter-spacing:.06em;cursor:pointer}
.btn-consulta:hover{background:var(--vermelho);border-color:var(--vermelho)}
#tela{position:relative;margin-top:1.5rem;padding:1.5rem 1.8rem;min-height:260px;max-height:55vh;overflow-y:auto;background:#fffdf7;border:1px solid var(--cinza);box-shadow:inset 0 0 0 4px #fffdf7,inset 0 0 0 5px #d8d2c2;font-family:"Courier New",Courier,monospace;font-size:1rem;line-height:1.6;color:#2b2a26}
#tela .saida{white-space:pre-wrap;margin:0 0 .4rem}
#tela .saida:first-child{color:var(--cinza)}
.carimbo{display:inline-block;margin-top:1.2rem;padding:.3rem .8rem;border:3px solid var(--vermelho);color:var(--vermelho);font-family:Archivo,sans-serif;font-weight:900;letter-spacing:.2em;transform:rotate(-4deg);opacity:.8}
.rodape-acervo{text-align:center;font-family:Archivo,sans-serif;font-size:.75rem;letter-spacing:.12em;color:var(--cinza);margin:2rem 0 1rem}
</style>
</head>
<body class="terminal">
<header class="cabecalho-terminal">
  <p class="sigla">GAZETA MENDES</p>
  <p class="subtitulo">SISTEMA DE CONSULTA DE ACERVO · MICROFILMES</p>
  <a class="btn-voltar" href="index.html">← Voltar à Gazeta Mendes</a>
</header>
<main class="acervo">
  <section class="caixa-busca">
    <label for="linha">CÓDIGO DO REGISTRO</label>
    <form class="linha-entrada" autocomplete="off">
      <span aria-hidden="true">&gt;</span>
      <input id="linha" type="text" aria-label="Código do registro" autofocus spellcheck="false">
      <button class="btn-consulta" type="submit" name="acao" value="consultar">Consultar Registro</button>
    </form>
  </section>
  <div id="tela" role="log" aria-live="polite"></div>
  <p><span class="carimbo">ACESSO RESTRITO</span></p>
</main>
<p class="rodape-acervo">Microfilme · Uso interno da redação</p>
<script src="dados.js"></script>
<script src="arg.js"></script>
<script>
  var form = document.querySelector(".linha-entrada");
  var linha = document.getElementById("linha");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (e.submitter && e.submitter.name === "acao") {
      linha.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
    }
  });
  document.getElementById("tela").addEventListener("click", function () {
    linha.focus();
  });
</script>
</body>
</html>
